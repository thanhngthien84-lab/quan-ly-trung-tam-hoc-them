<body>
  <div id="app"></div>
  <div id="modal-root"></div>
  <script>
    const STORAGE="tt_mvp_v1";
    const PUBLIC_API_URL="https://script.google.com/macros/s/AKfycbybUrOlatKVbsMQNUUpcGiYPYUsiqFBMKGWKi96hEsSHVVa3YhFgdHfNmaXi9GUblgM_g/exec";
    const initial={settings:{name:"TRUNG TÂM HỌC TẬP",apiUrl:"",adminKey:""},students:[],classes:[],enrollments:[],attendance:[],fees:[],grades:[],comments:[]};
    let state=JSON.parse(localStorage.getItem(STORAGE)||"null")||structuredClone(initial);
    state.grades=Array.isArray(state.grades)?state.grades:[];
    state.comments=Array.isArray(state.comments)?state.comments:[];
    let currentView="dashboard";
    let selectedAttendanceClassId="";
    let selectedClassDetailId="";
    let selectedFeeMonth=new Date().toISOString().slice(0,10);
    const $=s=>document.querySelector(s);
    const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const uid=p=>p+"-"+Date.now()+"-"+Math.random().toString(16).slice(2);
    const money=v=>Number(v||0).toLocaleString("vi-VN")+" đ";
    const today=()=>new Date().toISOString().slice(0,10);
    function save(){localStorage.setItem(STORAGE,JSON.stringify(state))}
    function persist(type,record){save();if(!(state.settings.apiUrl||PUBLIC_API_URL))return Promise.resolve();return jsonp("save",{payload:JSON.stringify({type,record})}).then(r=>{if(!r.ok)throw Error(r.message||"Không thể lưu lên Google Sheet")}).catch(e=>toast("Đã lưu trên máy, nhưng Sheet chưa cập nhật: "+e.message))}
    function toast(msg){const e=document.createElement("div");e.className="toast";e.textContent=msg;document.body.append(e);setTimeout(()=>e.remove(),2600)}
    function isParent(){return new URLSearchParams(location.search).get("phhs")==="1"}
    function nav(view){currentView=view;render()}
    function render(){
      if(isParent()) return renderParentLogin();
      const names={dashboard:"Tổng quan",students:"Học sinh",classes:"Lớp học",attendance:"Điểm danh",fees:"Học phí"};
      $("#app").innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand"><div class="brand-mark"><i class="ph-fill ph-graduation-cap"></i></div><div><b>${esc(state.settings.name)}</b><small>Quản lý trung tâm</small></div></div><nav class="nav">
      ${[["dashboard","squares-four","Tổng quan"],["students","student","Học sinh"],["classes","chalkboard-teacher","Lớp học"],["attendance","calendar-check","Điểm danh"],["fees","wallet","Học phí"]].map(x=>`<button class="${currentView===x[0]?"active":""}" onclick="nav('${x[0]}')"><i class="ph-bold ph-${x[1]}"></i><span>${x[2]}</span></button>`).join("")}
      </nav><div class="side-foot"><button onclick="openSettings()"><i class="ph-bold ph-gear"></i> Cài đặt kết nối</button></div></aside><main><header class="topbar"><h2>${names[currentView]}</h2><div class="top-actions"><button class="btn" onclick="openGoogleSheet()"><i class="ph-bold ph-table"></i> <span class="label">Mở Google Sheet</span></button><button class="btn soft" onclick="syncData()"><i class="ph-bold ph-arrows-clockwise"></i> <span class="label">Tải dữ liệu</span></button></div></header><div class="content">${renderView()}</div></main></div>`;
    }
    function renderView(){return ({dashboard:dashboardView,students:studentView,classes:classView,attendance:attendanceView,fees:feeView}[currentView]||dashboardView)()}
    function dashboardView(){
      const paid=state.fees.filter(x=>x.status==="paid").reduce((s,x)=>s+Number(x.amount||0),0), due=state.fees.filter(x=>x.status!=="paid").length;
      return `<section class="hero"><div><h1>Chào mừng trở lại 👋</h1><p>Theo dõi hoạt động trung tâm trong một màn hình gọn gàng.</p></div><div class="date-pill"><i class="ph-bold ph-calendar"></i> ${new Date().toLocaleDateString("vi-VN")}</div></section>
      <section class="stats"><div class="stat"><div class="stat-top"><span>Học sinh</span><i class="ph-bold ph-student"></i></div><strong>${state.students.length}</strong></div><div class="stat"><div class="stat-top"><span>Lớp đang mở</span><i class="ph-bold ph-chalkboard"></i></div><strong>${state.classes.length}</strong></div><div class="stat"><div class="stat-top"><span>Đã thu</span><i class="ph-bold ph-coins"></i></div><strong style="font-size:21px">${money(paid)}</strong></div><div class="stat"><div class="stat-top"><span>Khoản chưa thu</span><i class="ph-bold ph-warning-circle"></i></div><strong>${due}</strong></div></section>
      <section class="grid"><div class="panel"><div class="panel-head"><div><h3>Học sinh mới</h3><span class="muted">Danh sách cập nhật gần đây</span></div><button class="btn" onclick="nav('students')">Xem tất cả</button></div><div class="list">${state.students.slice(-5).reverse().map(studentRow).join("")||'<div class="empty">Chưa có học sinh. Hãy thêm học sinh đầu tiên.</div>'}</div></div>

    function openSettings(){modal(`<h3>Kết nối Google Sheet</h3><p class="muted">Sau khi triển khai Code.gs, dán URL Web app và mã quản trị tại đây.</p><form class="form" onsubmit="saveSettings(event)"><div class="field full"><label>Tên trung tâm</label><input name="name" value="${esc(state.settings.name)}"></div><div class="field full"><label>URL Apps Script</label><input name="apiUrl" value="${esc(state.settings.apiUrl)}"></div><div class="field full"><label>Mã quản trị</label><input name="adminKey" type="password" value="${esc(state.settings.adminKey)}"></div><div class="dialog-actions field full"><button type="button" class="btn" onclick="closeModal()">Hủy</button><button class="btn primary">Lưu cài đặt</button></div></form>`)}
    function saveSettings(e){e.preventDefault();state.settings={...state.settings,...Object.fromEntries(new FormData(e.target))};save();closeModal();render();toast("Đã lưu cài đặt")}
    function showSheetLoading(tab){tab.document.open();tab.document.write(`<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đang mở Google Sheet</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f8fc;color:#172033;font-family:Arial,sans-serif}.box{text-align:center;padding:32px}.icon{width:64px;height:64px;margin:0 auto 20px;border-radius:18px;background:#edf4ff;color:#3978f6;display:grid;place-items:center;font-size:30px}.spinner{width:30px;height:30px;border:4px solid #d9e5ff;border-top-color:#3978f6;border-radius:50%;margin:22px auto 0;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}h1{font-size:22px;margin:0 0 10px}p{margin:0;color:#708096;font-size:15px}</style></head><body><main class="box"><div class="icon">▦</div><h1>Đang mở Google Sheet…</h1><p>Hệ thống đang xác thực và lấy đường dẫn dữ liệu.</p><div class="spinner" aria-label="Đang tải"></div></main></body></html>`);tab.document.close()}
    function openGoogleSheet(){if(!state.settings.adminKey){openSettings();setTimeout(()=>toast("Tab ẩn danh chưa có mã quản trị. Hãy nhập mã rồi bấm Lưu cài đặt."),100);return}const tab=window.open("about:blank","_blank");if(!tab)return toast("Trình duyệt đang chặn cửa sổ mới");if(state.spreadsheetUrl){tab.location.href=state.spreadsheetUrl;return}showSheetLoading(tab);jsonp("all",{}).then(r=>{if(!r.ok)throw Error(r.message);state={...state,...r.data,settings:state.settings};save();if(!state.spreadsheetUrl)throw Error("Chưa lấy được đường dẫn Google Sheet");tab.location.href=state.spreadsheetUrl;render()}).catch(e=>{tab.close();if(String(e.message).includes("Mã quản trị")){openSettings();setTimeout(()=>toast("Mã quản trị chưa đúng. Hãy nhập lại rồi bấm Lưu cài đặt."),100)}else toast(e.message)})}
    function syncData(){if(!state.settings.apiUrl)return openSettings();jsonp("all",{}).then(r=>{if(!r.ok)throw Error(r.message);state={...state,...r.data,settings:state.settings};save();render();toast("Đã tải dữ liệu từ Google Sheet")}).catch(e=>toast(e.message))}
    function jsonp(mode,params){return new Promise((resolve,reject)=>{const cb="ttcb"+Date.now();const s=document.createElement("script");const t=setTimeout(()=>done({ok:false,message:"Kết nối quá thời gian"}),20000);function done(r){clearTimeout(t);delete window[cb];s.remove();resolve(r)}window[cb]=done;s.onerror=()=>done({ok:false,message:"Không thể kết nối Google Sheet"});const apiUrl=state.settings.apiUrl||PUBLIC_API_URL;if(!apiUrl)return done({ok:false,message:"Chưa cấu hình URL Apps Script"});s.src=apiUrl+"?mode="+encodeURIComponent(mode)+"&adminKey="+encodeURIComponent(state.settings.adminKey)+"&callback="+cb+Object.entries(params).map(([k,v])=>"&"+k+"="+encodeURIComponent(v)).join("");document.head.append(s)})}
    function renderParentLogin(){$("#app").innerHTML=`<section class="parent"><div class="parent-login"><form class="login-card" onsubmit="parentLookup(event)"><div class="brand-mark"><i class="ph-fill ph-student"></i></div><h2>Cổng Phụ Huynh</h2><p>Nhập mã tra cứu để xem hồ sơ học tập</p><div class="pin-wrap"><input id="parent-pin" name="pin" inputmode="numeric" autocomplete="off" maxlength="5" pattern="\\d{5}" aria-label="Mã tra cứu 5 chữ số" placeholder="VD: 12345" required autofocus></div><button id="parent-lookup-submit-button" class="parent-submit" type="submit">TRA CỨU NGAY</button></form></div></section>`}
    function setParentLookupBusy(isBusy){const button=$("#parent-lookup-submit-button"),input=$("#parent-pin");if(button){button.disabled=isBusy;button.innerHTML=isBusy?'<i class="ph-bold ph-spinner-gap ph-spin"></i> ĐANG TRA CỨU...':'TRA CỨU NGAY'}if(input)input.disabled=isBusy}
    async function parentLookup(e){e.preventDefault();const pin=String(new FormData(e.target).get("pin")||"").replace(/\D/g,"");if(!/^\d{5}$/.test(pin))return toast("Mã tra cứu phải gồm đúng 5 chữ số");const apiUrl=state.settings.apiUrl||PUBLIC_API_URL;if(apiUrl){setParentLookupBusy(true);toast("Đang tải dữ liệu học tập...");try{let r=await jsonp("parent",{pin});if(!r.ok)throw Error(r.message);state.students=[r.data.student];state.attendance=r.data.attendance||[];state.fees=r.data.fees||[];state.grades=r.data.grades||[];state.comments=r.data.comments||[];state.classes=r.data.classes||[];state.parentUpdatedAt=r.data.updatedAt||new Date().toISOString();renderProfile(r.data.student)}catch(x){toast(x.message)}finally{setParentLookupBusy(false)}return}const s=state.students.find(x=>x.pin===pin);if(!s)return toast("Mã tra cứu không chính xác");renderProfile(s)}
    function dateValue(value){const text=String(value||"");const vi=text.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(vi)return new Date(Number(vi[3]),Number(vi[2])-1,Number(vi[1])).getTime();const parsed=Date.parse(text);return Number.isFinite(parsed)?parsed:0}
    function scoreChart(items){const sorted=items.slice().sort((a,b)=>dateValue(a.date)-dateValue(b.date)),w=1040,h=300,left=48,right=22,top=28,bottom=72,plotW=w-left-right,plotH=h-top-bottom;if(!sorted.length)return '<div class="empty">Chưa có dữ liệu điểm</div>';const point=(g,index,value)=>{const x=left+(sorted.length===1?plotW/2:index*plotW/(sorted.length-1)),y=top+(10-Math.max(0,Math.min(10,Number(value||0))))/10*plotH;return{x,y,g}},pts=sorted.map((g,index)=>point(g,index,g.score)),avgPts=sorted.map((g,index)=>Number.isFinite(Number(g.classAverage))?point(g,index,g.classAverage):null).filter(Boolean),poly=pts.map(p=>p.x+','+p.y).join(' '),avgPoly=avgPts.map(p=>p.x+','+p.y).join(' ');return `<div style="overflow-x:auto"><svg viewBox="0 0 ${w} ${h}" style="width:100%;min-width:760px;height:auto" role="img" aria-label="Biểu đồ kết quả môn Vật Lí"><g stroke="#e3e9f1" stroke-width="1">${[0,2,4,6,8,10].map(v=>{const y=top+(10-v)/10*plotH;return `<line x1="${left}" y1="${y}" x2="${w-right}" y2="${y}"/><text x="10" y="${y+4}" fill="#8490a4" stroke="none" font-size="12">${v}</text>`}).join("")}</g><g><line x1="390" y1="11" x2="420" y2="11" stroke="#5d7fe7" stroke-width="5"/><text x="428" y="15" fill="#708096" font-size="12">Điểm học sinh</text>${avgPts.length?'<line x1="540" y1="11" x2="570" y2="11" stroke="#75a56d" stroke-width="3" stroke-dasharray="8 7"/><text x="578" y="15" fill="#708096" font-size="12">Điểm TB lớp</text>':""}</g>${avgPts.length?`<polyline points="${avgPoly}" fill="none" stroke="#75a56d" stroke-width="3" stroke-dasharray="8 7" stroke-linecap="round"/>`:""}<polyline points="${poly}" fill="none" stroke="#5d7fe7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>${pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="6" fill="#5d7fe7"/><text x="${p.x}" y="${p.y-13}" text-anchor="middle" fill="#263c86" font-size="12" font-weight="700">${esc(p.g.score)}</text><text x="${p.x}" y="${h-43}" text-anchor="middle" fill="#708096" font-size="10" transform="rotate(-32 ${p.x} ${h-43})">${esc(p.g.date||"")}</text>`).join("")}</svg></div>`}
    function renderProfile(s){const att=state.attendance.filter(a=>a.studentId===s.id),fees=state.fees.filter(f=>f.studentId===s.id),grades=state.grades.filter(g=>g.studentId===s.id).slice().sort((a,b)=>dateValue(a.date)-dateValue(b.date)),comments=state.comments.filter(c=>c.studentId===s.id).slice().sort((a,b)=>dateValue(b.date)-dateValue(a.date)),present=att.filter(a=>a.status==="present").length,late=att.filter(a=>a.status==="late").length,excused=att.filter(a=>a.status==="excused").length,absent=att.filter(a=>a.status==="unexcused").length,total=att.length,rate=total?Math.round((present+late)/total*100):0,scores=grades.map(g=>Number(g.score||0)),avg=scores.length?(scores.reduce((n,v)=>n+v,0)/scores.length).toFixed(2):"--",trend=scores.length<2?"Chưa đủ dữ liệu":scores[scores.length-1]>scores[0]+.2?"Cải thiện":scores[scores.length-1]<scores[0]-.2?"Cần cố gắng":"Ổn định",classNames=state.classes.map(c=>c.name).filter(Boolean).join(", ")||"Vật Lí",updated=state.parentUpdatedAt?new Date(state.parentUpdatedAt).toLocaleString("vi-VN"):"Vừa cập nhật",latestComment=comments[0];$("#app").innerHTML=`<section class="profile phhs-profile"><header class="profile-head"><div><b>HỒ SƠ HỌC TẬP</b><div style="font-size:13px;color:#c9d1ef;margin-top:5px">${esc(s.name)} · VẬT LÍ · ${esc(classNames)}</div><div style="font-size:11px;color:#aeb9df;margin-top:4px">Mã HS: ${esc(s.code)}</div></div><button class="btn" onclick="renderParentLogin()">Đóng</button></header><main class="profile-body"><div class="ph-update"><i class="ph-bold ph-clock"></i> Dữ liệu cập nhật lúc ${esc(updated)}</div><section class="ph-card"><div class="ph-title"><i class="ph-bold ph-user-check"></i><h2>CHUYÊN CẦN</h2></div><div class="attendance-layout"><div class="attendance-stats"><div class="metric"><span>Tổng số buổi</span><strong>${total}</strong></div><div class="metric present"><span>Có mặt</span><strong>${present}</strong></div><div class="metric late"><span>Đi muộn</span><strong>${late}</strong></div><div class="metric excused"><span>Vắng có phép</span><strong>${excused}</strong></div><div class="metric absent"><span>Vắng không phép</span><strong>${absent}</strong></div></div><div class="donut" style="background:conic-gradient(#5275e8 0 ${rate}%,#e9eefb ${rate}% 100%)"><div class="donut-center"><strong>${rate}%</strong><span>Tỷ lệ chuyên cần</span></div></div></div></section><section class="ph-card"><div class="ph-title" style="margin-bottom:10px"><i class="ph-bold ph-chart-line-up"></i><div><h2>Kết quả học tập môn Vật Lí</h2><div class="muted">Điểm học sinh và điểm trung bình lớp</div></div></div><div class="chart-box">${scoreChart(grades)}</div><div class="learning-metrics"><div class="metric"><span>Điểm trung bình</span><strong>${avg}</strong></div><div class="metric"><span>Điểm cao nhất</span><strong>${scores.length?Math.max(...scores):"--"}</strong></div><div class="metric"><span>Điểm thấp nhất</span><strong>${scores.length?Math.min(...scores):"--"}</strong></div><div class="metric"><span>Tổng số bài</span><strong>${scores.length}</strong></div><div class="metric"><span>Xu hướng học tập</span><strong style="font-size:20px">${trend}</strong></div></div></section><section class="ph-card" style="overflow-x:auto"><h2>Bảng điểm môn Vật Lí</h2><table class="ph-table"><thead><tr><th>Ngày</th><th>Tên bài kiểm tra</th><th>Lớp học</th><th>Điểm</th><th>Điểm TB lớp</th><th>Ghi chú</th></tr></thead><tbody>${grades.map(g=>{const c=state.classes.find(x=>x.id===g.classId),note=comments.find(x=>x.classId===g.classId&&String(x.date||"")===String(g.date||""));return `<tr><td>${esc(g.date||"--")}</td><td><b>${esc(g.title||"Bài kiểm tra")}</b></td><td>${esc(c?.name||"--")}</td><td class="score">${esc(g.score)}</td><td><b>${Number.isFinite(Number(g.classAverage))?esc(g.classAverage):"--"}</b></td><td>${esc(note?.text||"--")}</td></tr>`}).join("")||'<tr><td colspan="6" class="empty">Chưa có dữ liệu điểm</td></tr>'}</tbody></table></section><section class="ph-card"><div class="teacher-comment"><i class="ph-fill ph-chat-circle-dots"></i><div><h2 style="margin:0 0 5px">Nhận xét của giáo viên</h2><div class="muted">${latestComment?"Cập nhật "+esc(latestComment.date||""):"Chưa có nhận xét"}</div><p style="font-size:17px;line-height:1.7;margin-bottom:0">${esc(latestComment?.text||"Chưa có nhận xét mới.")}</p></div></div></section><section class="ph-card"><h2>Tình hình học phí</h2><div class="fee-list">${fees.map(f=>{const c=state.classes.find(x=>x.id===f.classId);return `<div class="row"><b>${esc(c?.name||"Lớp Vật Lí")} · Tháng ${esc(f.month)}</b><span class="tag">${f.status==="paid"?"Đã đóng":"Chưa đóng"} · ${money(f.amount)}</span></div>`}).join("")||'<div class="empty">Chưa có dữ liệu học phí</div>'}</div></section></main></section>`}

    render();
  </script>
</body>
</html>
