<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Quản lý Trung tâm Học thêm</title>
  <meta name="description" content="Quản lý học sinh, lớp học, điểm danh và học phí">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    :root{--ink:#172033;--muted:#708096;--line:#e3e9f1;--paper:#f6f8fc;--nav:#102a43;--blue:#3978f6;--green:#24a677;--orange:#f59e42;--red:#e95757}
    *{box-sizing:border-box}body{margin:0;font-family:"Be Vietnam Pro",sans-serif;color:var(--ink);background:var(--paper)}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
    .shell{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.sidebar{background:linear-gradient(180deg,#102a43,#173b5d);color:#fff;padding:26px 18px;position:sticky;top:0;height:100vh}
    .brand{display:flex;gap:12px;align-items:center;padding:0 10px 28px}.brand-mark{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:#fff;color:var(--blue);font-size:25px}.brand b{display:block;font-size:15px}.brand small{color:#a9c4da}
    .nav{display:grid;gap:8px}.nav button{border:0;background:transparent;color:#c7d8e7;padding:13px 14px;border-radius:13px;text-align:left;font-weight:700;display:flex;gap:12px;align-items:center}.nav button.active,.nav button:hover{background:#fff;color:#12324f}.nav i{font-size:20px}
    .side-foot{position:absolute;bottom:22px;left:18px;right:18px}.side-foot button{width:100%;border:1px solid #ffffff2b;background:#ffffff10;color:#fff;border-radius:12px;padding:11px;font-weight:700}
    main{min-width:0}.topbar{height:84px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;position:sticky;top:0;z-index:5}.topbar h2{font-size:18px}.top-actions{display:flex;gap:10px}.btn{border:1px solid var(--line);background:#fff;padding:11px 16px;border-radius:12px;font-weight:700;color:var(--ink)}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.green{background:var(--green);border-color:var(--green);color:#fff}.btn.soft{background:#edf4ff;color:#2862d9;border-color:#d5e4ff}
    .content{max-width:1400px;margin:auto;padding:30px 34px 60px}.hero{background:linear-gradient(120deg,#173b5d,#3978f6);color:#fff;border-radius:26px;padding:28px 30px;display:flex;justify-content:space-between;gap:20px;align-items:center;box-shadow:0 16px 40px #173b5d20}.hero h1{margin:0 0 8px;font-size:27px}.hero p{margin:0;color:#dbeaff}.date-pill{background:#ffffff18;border:1px solid #ffffff2b;border-radius:16px;padding:13px 18px;font-weight:700}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:22px 0}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 7px 22px #16324f0b}.stat{padding:20px}.stat-top{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;font-weight:700}.stat i{font-size:22px}.stat strong{display:block;font-size:28px;margin-top:8px}.grid{display:grid;grid-template-columns:1.35fr .8fr;gap:18px}.panel{padding:22px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.panel h3{margin:0;font-size:18px}.muted{color:var(--muted);font-size:13px}.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.quick button{border:1px solid var(--line);background:#fff;border-radius:16px;padding:18px;text-align:left}.quick i{display:block;font-size:25px;color:var(--blue);margin-bottom:10px}.quick b{display:block}.quick small{color:var(--muted)}
    .list{display:grid;gap:10px}.row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:15px}.row-main{display:flex;gap:12px;align-items:center}.avatar{width:42px;height:42px;border-radius:14px;background:#edf4ff;color:var(--blue);display:grid;place-items:center;font-weight:800}.tag{display:inline-block;padding:5px 9px;border-radius:9px;background:#eef7f3;color:#17825d;font-size:11px;font-weight:700}.money{font-weight:800;color:var(--green)}
    .view{display:none}.view.active{display:block}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:14px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.table th{color:var(--muted);font-size:11px;text-transform:uppercase}.empty{text-align:center;color:var(--muted);padding:45px}
    .modal{position:fixed;inset:0;background:#102a43aa;z-index:20;display:grid;place-items:center;padding:18px}.dialog{background:#fff;width:min(620px,100%);max-height:92vh;overflow:auto;border-radius:24px;padding:25px;box-shadow:0 30px 80px #0003}.dialog h3{margin-top:0}.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700;color:var(--muted)}.field input,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;outline:none}.field input:focus,.field select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #3978f618}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
    .toast{position:fixed;right:22px;bottom:22px;background:#163b5d;color:#fff;padding:14px 18px;border-radius:13px;z-index:50;box-shadow:0 15px 35px #0003;font-weight:700}.parent{min-height:100vh;background:linear-gradient(135deg,#102a43,#24567e);display:grid;place-items:center;padding:20px}.login-card{background:#fff;width:min(480px,100%);border-radius:28px;padding:34px;text-align:center}.login-card .brand-mark{margin:0 auto 18px;background:#edf4ff}.login-card input{width:100%;font-size:24px;letter-spacing:8px;text-align:center;padding:16px;border:1px solid var(--line);border-radius:14px;margin:18px 0}.profile{background:var(--paper);min-height:100vh}.profile-head{background:var(--nav);color:#fff;padding:18px 6vw;display:flex;justify-content:space-between;align-items:center}.profile-body{max-width:960px;margin:auto;padding:24px;display:grid;gap:16px}.profile-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.profile .panel strong{font-size:24px}
    @media(max-width:900px){.shell{grid-template-columns:1fr}.sidebar{position:fixed;left:0;right:0;bottom:0;top:auto;height:72px;z-index:10;padding:8px}.brand,.side-foot{display:none}.nav{grid-template-columns:repeat(5,1fr);gap:3px}.nav button{padding:8px 3px;display:grid;place-items:center;gap:2px;font-size:9px;text-align:center}.nav i{font-size:20px}.topbar{height:68px;padding:0 16px}.content{padding:18px 14px 95px}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.hero{align-items:flex-start}.date-pill{display:none}.form{grid-template-columns:1fr}.field.full{grid-column:auto}.profile-grid{grid-template-columns:1fr}.top-actions .label{display:none}}
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="modal-root"></div>
  <script>
    const STORAGE="tt_mvp_v1";
    const PUBLIC_API_URL="https://script.google.com/macros/s/AKfycbybUrOlatKVbsMQNUUpcGiYPYUsiqFBMKGWKi96hEsSHVVa3YhFgdHfNmaXi9GUblgM_g/exec";
    const initial={settings:{name:"TRUNG TÂM HỌC TẬP",apiUrl:"",adminKey:""},students:[],classes:[],enrollments:[],attendance:[],fees:[]};
    let state=JSON.parse(localStorage.getItem(STORAGE)||"null")||structuredClone(initial);
    let currentView="dashboard";
    const $=s=>document.querySelector(s);
    const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const uid=p=>p+"-"+Date.now()+"-"+Math.random().toString(16).slice(2);
    const money=v=>Number(v||0).toLocaleString("vi-VN")+" đ";
    const today=()=>new Date().toISOString().slice(0,10);
    function save(){localStorage.setItem(STORAGE,JSON.stringify(state))}
    function persist(type,record){save();if(!(state.settings.apiUrl||PUBLIC_API_URL))return Promise.resolve();return jsonp("save",{payload:JSON.stringify({type,record})}).then(r=>{if(!r.ok)throw Error(r.message||"Không thể lưu lên Google Sheet")}).catch(e=>toast("Đã lưu trên máy, nhưng Sheet chưa cập nhật: "+e.message))}
    function toast(msg){const e=document.createElement("div");e.className="toast";e.textContent=msg;document.body.append(e);setTimeout(()=>e.remove(),2600)}
    function isParent(){return new URLSearchParams(location.search).get("phhs")==="1"}
    function nav(view){currentView=view;render()}
    function render(){
      if(isParent()) return renderParentLogin();
      const names={dashboard:"Tổng quan",students:"Học sinh",classes:"Lớp học",attendance:"Điểm danh",fees:"Học phí"};
      $("#app").innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand"><div class="brand-mark"><i class="ph-fill ph-graduation-cap"></i></div><div><b>${esc(state.settings.name)}</b><small>Quản lý trung tâm</small></div></div><nav class="nav">
      ${[["dashboard","squares-four","Tổng quan"],["students","student","Học sinh"],["classes","chalkboard-teacher","Lớp học"],["attendance","calendar-check","Điểm danh"],["fees","wallet","Học phí"]].map(x=>`<button class="${currentView===x[0]?"active":""}" onclick="nav('${x[0]}')"><i class="ph-bold ph-${x[1]}"></i><span>${x[2]}</span></button>`).join("")}
      </nav><div class="side-foot"><button onclick="openSettings()"><i class="ph-bold ph-gear"></i> Cài đặt kết nối</button></div></aside><main><header class="topbar"><h2>${names[currentView]}</h2><div class="top-actions"><button class="btn soft" onclick="syncData()"><i class="ph-bold ph-arrows-clockwise"></i> <span class="label">Tải dữ liệu</span></button><button class="btn primary" onclick="quickAdd()"><i class="ph-bold ph-plus"></i> <span class="label">Thêm mới</span></button></div></header><div class="content">${renderView()}</div></main></div>`;
    }
    function renderView(){return ({dashboard:dashboardView,students:studentView,classes:classView,attendance:attendanceView,fees:feeView}[currentView]||dashboardView)()}
    function dashboardView(){
      const paid=state.fees.filter(x=>x.status==="paid").reduce((s,x)=>s+Number(x.amount||0),0), due=state.fees.filter(x=>x.status!=="paid").length;
      return `<section class="hero"><div><h1>Chào mừng trở lại 👋</h1><p>Theo dõi hoạt động trung tâm trong một màn hình gọn gàng.</p></div><div class="date-pill"><i class="ph-bold ph-calendar"></i> ${new Date().toLocaleDateString("vi-VN")}</div></section>
      <section class="stats"><div class="stat"><div class="stat-top"><span>Học sinh</span><i class="ph-bold ph-student"></i></div><strong>${state.students.length}</strong></div><div class="stat"><div class="stat-top"><span>Lớp đang mở</span><i class="ph-bold ph-chalkboard"></i></div><strong>${state.classes.length}</strong></div><div class="stat"><div class="stat-top"><span>Đã thu</span><i class="ph-bold ph-coins"></i></div><strong style="font-size:21px">${money(paid)}</strong></div><div class="stat"><div class="stat-top"><span>Khoản chưa thu</span><i class="ph-bold ph-warning-circle"></i></div><strong>${due}</strong></div></section>
      <section class="grid"><div class="panel"><div class="panel-head"><div><h3>Học sinh mới</h3><span class="muted">Danh sách cập nhật gần đây</span></div><button class="btn" onclick="nav('students')">Xem tất cả</button></div><div class="list">${state.students.slice(-5).reverse().map(studentRow).join("")||'<div class="empty">Chưa có học sinh. Hãy thêm học sinh đầu tiên.</div>'}</div></div>
      <div class="panel"><div class="panel-head"><h3>Thao tác nhanh</h3></div><div class="quick"><button onclick="openStudent()"><i class="ph-bold ph-user-plus"></i><b>Thêm học sinh</b><small>Tạo hồ sơ và mã PIN</small></button><button onclick="openClass()"><i class="ph-bold ph-chalkboard-teacher"></i><b>Tạo lớp học</b><small>Lịch và học phí lớp</small></button><button onclick="nav('attendance')"><i class="ph-bold ph-calendar-check"></i><b>Điểm danh</b><small>Theo từng lớp, từng buổi</small></button><button onclick="nav('fees')"><i class="ph-bold ph-receipt"></i><b>Thu học phí</b><small>Theo dõi công nợ</small></button></div></div></section>`;
    }
    function studentRow(s){const cls=state.enrollments.filter(e=>e.studentId===s.id).map(e=>state.classes.find(c=>c.id===e.classId)?.name).filter(Boolean);return `<div class="row"><div class="row-main"><div class="avatar">${esc(s.name).split(" ").pop()?.[0]||"H"}</div><div><b>${esc(s.name)}</b><div class="muted">${esc(s.code)} · ${esc(s.phone||"Chưa có SĐT")}</div></div></div><span class="tag">${esc(cls.join(", ")||"Chưa xếp lớp")}</span></div>`}
    function studentView(){return `<div class="panel"><div class="panel-head"><div><h3>Danh sách học sinh</h3><span class="muted">${state.students.length} hồ sơ</span></div><button class="btn primary" onclick="openStudent()"><i class="ph-bold ph-user-plus"></i> Thêm học sinh</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Mã HS</th><th>Họ tên</th><th>Lớp/Trường</th><th>PHHS</th><th>Mã tra cứu</th><th>Lớp học thêm</th></tr></thead><tbody>${state.students.map(s=>`<tr><td><b>${esc(s.code)}</b></td><td>${esc(s.name)}</td><td>${esc(s.schoolClass||"--")}</td><td>${esc(s.phone||"--")}</td><td><span class="tag">${esc(s.pin)}</span></td><td>${esc(state.enrollments.filter(e=>e.studentId===s.id).map(e=>state.classes.find(c=>c.id===e.classId)?.name).filter(Boolean).join(", ")||"--")}</td></tr>`).join("")||'<tr><td colspan="6" class="empty">Chưa có học sinh</td></tr>'}</tbody></table></div></div>`}
    function classView(){return `<div class="toolbar"><button class="btn primary" onclick="openClass()"><i class="ph-bold ph-plus"></i> Tạo lớp</button></div><div class="stats">${state.classes.map(c=>`<div class="stat"><div class="stat-top"><span>${esc(c.subject)}</span><i class="ph-bold ph-chalkboard-teacher"></i></div><strong style="font-size:20px">${esc(c.name)}</strong><div class="muted">${esc(c.schedule||"Chưa đặt lịch")} · ${state.enrollments.filter(e=>e.classId===c.id).length} HS</div></div>`).join("")||'<div class="panel empty" style="grid-column:1/-1">Chưa có lớp học</div>'}</div>`}
    function attendanceView(){const cls=state.classes[0], members=cls?state.enrollments.filter(e=>e.classId===cls.id).map(e=>state.students.find(s=>s.id===e.studentId)).filter(Boolean):[];return `<div class="panel"><div class="panel-head"><div><h3>Điểm danh theo buổi</h3><span class="muted">Chọn trạng thái rồi bấm lưu</span></div><button class="btn green" onclick="saveAttendance()">Lưu điểm danh</button></div><div class="toolbar"><select class="btn" id="att-class" onchange="render()">${state.classes.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select><input class="btn" id="att-date" type="date" value="${today()}"></div><div class="list">${members.map(s=>`<div class="row"><div class="row-main"><div class="avatar">${esc(s.name).slice(0,1)}</div><b>${esc(s.name)}</b></div><select class="btn att-status" data-id="${s.id}"><option value="present">Có mặt</option><option value="late">Đi muộn</option><option value="excused">Vắng có phép</option><option value="unexcused">Vắng không phép</option></select></div>`).join("")||'<div class="empty">Hãy tạo lớp và xếp học sinh vào lớp trước.</div>'}</div></div>`}
    function feeView(){return `<div class="toolbar"><button class="btn primary" onclick="openFee()">Tạo khoản học phí</button></div><div class="panel table-wrap"><table class="table"><thead><tr><th>Học sinh</th><th>Tháng</th><th>Số tiền</th><th>Trạng thái</th><th></th></tr></thead><tbody>${state.fees.map(f=>{const s=state.students.find(x=>x.id===f.studentId);return `<tr><td>${esc(s?.name||"Không rõ")}</td><td>${esc(f.month)}</td><td class="money">${money(f.amount)}</td><td><span class="tag">${f.status==="paid"?"Đã đóng":"Chưa đóng"}</span></td><td><button class="btn" onclick="toggleFee('${f.id}')">Đổi trạng thái</button></td></tr>`}).join("")||'<tr><td colspan="5" class="empty">Chưa có khoản học phí</td></tr>'}</tbody></table></div>`}
    function quickAdd(){({students:openStudent,classes:openClass,fees:openFee,attendance:saveAttendance}[currentView]||openStudent)()}
    function modal(html){$("#modal-root").innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="dialog">${html}</div></div>`}
    function closeModal(){$("#modal-root").innerHTML=""}
    function openStudent(){modal(`<h3>Thêm học sinh</h3><form class="form" onsubmit="addStudent(event)"><div class="field"><label>Mã học sinh</label><input name="code" required></div><div class="field"><label>Họ và tên</label><input name="name" required></div><div class="field"><label>Lớp / trường đang học</label><input name="schoolClass"></div><div class="field"><label>Số điện thoại PHHS</label><input name="phone" inputmode="tel"></div><div class="field full"><label>Xếp vào lớp học thêm</label><select name="classId"><option value="">Chưa xếp lớp</option>${state.classes.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select></div><div class="dialog-actions field full"><button type="button" class="btn" onclick="closeModal()">Hủy</button><button class="btn primary">Lưu học sinh</button></div></form>`)}
    function addStudent(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(state.students.some(s=>s.code===d.code))return toast("Mã học sinh đã tồn tại");const used=new Set(state.students.map(s=>s.pin));let pin;do{pin=String(Math.floor(Math.random()*100000)).padStart(5,"0")}while(used.has(pin));const s={id:uid("hs"),code:d.code.trim(),name:d.name.trim(),schoolClass:d.schoolClass.trim(),phone:d.phone.replace(/\D/g,""),pin};state.students.push(s);persist("student",s);if(d.classId){const enrollment={id:uid("dk"),studentId:s.id,classId:d.classId};state.enrollments.push(enrollment);persist("enrollment",enrollment)}closeModal();render();toast("Đã thêm học sinh và tạo mã "+pin)}
    function openClass(){modal(`<h3>Tạo lớp học thêm</h3><form class="form" onsubmit="addClass(event)"><div class="field"><label>Tên lớp</label><input name="name" placeholder="Toán 9A" required></div><div class="field"><label>Môn học</label><input name="subject" placeholder="Toán" required></div><div class="field"><label>Lịch học</label><input name="schedule" placeholder="Thứ 3, 18:00"></div><div class="field"><label>Học phí/tháng</label><input name="tuition" type="number" min="0"></div><div class="dialog-actions field full"><button type="button" class="btn" onclick="closeModal()">Hủy</button><button class="btn primary">Tạo lớp</button></div></form>`)}
    function addClass(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target)),record={id:uid("lop"),...d};state.classes.push(record);persist("class",record);closeModal();render();toast("Đã tạo lớp học")}
    function saveAttendance(){const cls=$("#att-class")?.value,date=$("#att-date")?.value;if(!cls||!date)return toast("Chưa có lớp học để điểm danh");document.querySelectorAll(".att-status").forEach(x=>{state.attendance=state.attendance.filter(a=>!(a.classId===cls&&a.date===date&&a.studentId===x.dataset.id));const record={id:"dd-"+cls+"-"+date+"-"+x.dataset.id,classId:cls,date,studentId:x.dataset.id,status:x.value};state.attendance.push(record);persist("attendance",record)});toast("Đã lưu điểm danh")}
    function openFee(){if(!state.students.length)return toast("Hãy thêm học sinh trước");modal(`<h3>Tạo khoản học phí</h3><form class="form" onsubmit="addFee(event)"><div class="field full"><label>Học sinh</label><select name="studentId">${state.students.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("")}</select></div><div class="field"><label>Tháng</label><input name="month" type="month" required></div><div class="field"><label>Số tiền</label><input name="amount" type="number" min="0" required></div><div class="dialog-actions field full"><button type="button" class="btn" onclick="closeModal()">Hủy</button><button class="btn primary">Tạo khoản thu</button></div></form>`)}
    function addFee(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target)),record={id:uid("hp"),...d,status:"unpaid"};state.fees.push(record);persist("fee",record);closeModal();render();toast("Đã tạo khoản học phí")}
    function toggleFee(id){const f=state.fees.find(x=>x.id===id);f.status=f.status==="paid"?"unpaid":"paid";f.paidAt=f.status==="paid"?today():"";persist("fee",f);render()}
    function openSettings(){modal(`<h3>Kết nối Google Sheet</h3><p class="muted">Sau khi triển khai Code.gs, dán URL Web app và mã quản trị tại đây.</p><form class="form" onsubmit="saveSettings(event)"><div class="field full"><label>Tên trung tâm</label><input name="name" value="${esc(state.settings.name)}"></div><div class="field full"><label>URL Apps Script</label><input name="apiUrl" value="${esc(state.settings.apiUrl)}"></div><div class="field full"><label>Mã quản trị</label><input name="adminKey" type="password" value="${esc(state.settings.adminKey)}"></div><div class="dialog-actions field full"><button type="button" class="btn" onclick="closeModal()">Hủy</button><button class="btn primary">Lưu cài đặt</button></div></form>`)}
    function saveSettings(e){e.preventDefault();state.settings={...state.settings,...Object.fromEntries(new FormData(e.target))};save();closeModal();render();toast("Đã lưu cài đặt")}
    function syncData(){if(!state.settings.apiUrl)return openSettings();jsonp("all",{}).then(r=>{if(!r.ok)throw Error(r.message);state={...state,...r.data,settings:state.settings};save();render();toast("Đã tải dữ liệu từ Google Sheet")}).catch(e=>toast(e.message))}
    function jsonp(mode,params){return new Promise((resolve,reject)=>{const cb="ttcb"+Date.now();const s=document.createElement("script");const t=setTimeout(()=>done({ok:false,message:"Kết nối quá thời gian"}),20000);function done(r){clearTimeout(t);delete window[cb];s.remove();resolve(r)}window[cb]=done;s.onerror=()=>done({ok:false,message:"Không thể kết nối Google Sheet"});const apiUrl=state.settings.apiUrl||PUBLIC_API_URL;if(!apiUrl)return done({ok:false,message:"Chưa cấu hình URL Apps Script"});s.src=apiUrl+"?mode="+encodeURIComponent(mode)+"&adminKey="+encodeURIComponent(state.settings.adminKey)+"&callback="+cb+Object.entries(params).map(([k,v])=>"&"+k+"="+encodeURIComponent(v)).join("");document.head.append(s)})}
    function renderParentLogin(){$("#app").innerHTML=`<section class="parent"><form class="login-card" onsubmit="parentLookup(event)"><div class="brand-mark"><i class="ph-fill ph-graduation-cap"></i></div><h1>Cổng Phụ huynh</h1><p class="muted">Nhập mã tra cứu 5 chữ số để xem thông tin học tập</p><input name="pin" inputmode="numeric" maxlength="5" pattern="\\d{5}" placeholder="•••••" required><button class="btn primary" style="width:100%">TRA CỨU</button><p class="muted" style="margin-top:18px">${esc(state.settings.name)}</p></form></section>`}
    function parentLookup(e){e.preventDefault();const pin=new FormData(e.target).get("pin"),apiUrl=state.settings.apiUrl||PUBLIC_API_URL;if(apiUrl){jsonp("parent",{pin}).then(r=>{if(!r.ok)throw Error(r.message);state.students=[r.data.student];state.attendance=r.data.attendance||[];state.fees=r.data.fees||[];renderProfile(r.data.student)}).catch(x=>toast(x.message));return}const s=state.students.find(x=>x.pin===pin);if(!s)return toast("Mã tra cứu không chính xác");renderProfile(s)}
    function renderProfile(s){const att=state.attendance.filter(a=>a.studentId===s.id),fees=state.fees.filter(f=>f.studentId===s.id),paid=fees.filter(f=>f.status==="paid").reduce((n,f)=>n+Number(f.amount),0);$("#app").innerHTML=`<section class="profile"><header class="profile-head"><div><b>HỒ SƠ HỌC TẬP</b><div style="font-size:12px;color:#b8d2e8">${esc(state.settings.name)}</div></div><button class="btn" onclick="renderParentLogin()">Đóng</button></header><main class="profile-body"><div class="panel"><h2>${esc(s.name)}</h2><p class="muted">Mã HS: ${esc(s.code)} · ${esc(s.schoolClass||"")}</p></div><div class="profile-grid"><div class="panel"><span class="muted">Số buổi học</span><strong>${att.length}</strong></div><div class="panel"><span class="muted">Có mặt / đi muộn</span><strong>${att.filter(a=>a.status==="present"||a.status==="late").length}</strong></div><div class="panel"><span class="muted">Học phí đã đóng</span><strong style="font-size:19px">${money(paid)}</strong></div></div><div class="panel"><h3>Tình hình học phí</h3><div class="list">${fees.map(f=>`<div class="row"><b>Tháng ${esc(f.month)}</b><span class="tag">${f.status==="paid"?"Đã đóng":"Chưa đóng"} · ${money(f.amount)}</span></div>`).join("")||'<div class="empty">Chưa có dữ liệu học phí</div>'}</div></div></main></section>`}
    render();
  </script>
</body>
</html>
