<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Quản lý Trung tâm Học thêm</title>
  <meta name="description" content="Quản lý học sinh, lớp học, điểm danh và học phí">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    :root{--ink:#172033;--muted:#708096;--line:#e3e9f1;--paper:#f6f8fc;--nav:#102a43;--blue:#3978f6;--green:#24a677;--orange:#f59e42;--red:#e95757}
    *{box-sizing:border-box}body{margin:0;font-family:"Be Vietnam Pro",sans-serif;color:var(--ink);background:var(--paper)}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
    .shell{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.sidebar{background:linear-gradient(180deg,#102a43,#173b5d);color:#fff;padding:26px 18px;position:sticky;top:0;height:100vh}
    .brand{display:flex;gap:12px;align-items:center;padding:0 10px 28px}.brand-mark{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:#fff;color:var(--blue);font-size:25px}.brand b{display:block;font-size:15px}.brand small{color:#a9c4da}
    .nav{display:grid;gap:8px}.nav button{border:0;background:transparent;color:#c7d8e7;padding:13px 14px;border-radius:13px;text-align:left;font-weight:700;display:flex;gap:12px;align-items:center}.nav button.active,.nav button:hover{background:#fff;color:#12324f}.nav i{font-size:20px}
    .side-foot{position:absolute;bottom:22px;left:18px;right:18px}.side-foot button{width:100%;border:1px solid #ffffff2b;background:#ffffff10;color:#fff;border-radius:12px;padding:11px;font-weight:700}
    main{min-width:0}.topbar{height:84px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;position:sticky;top:0;z-index:5}.topbar h2{font-size:18px}.top-actions{display:flex;gap:10px}.btn{border:1px solid var(--line);background:#fff;padding:11px 16px;border-radius:12px;font-weight:700;color:var(--ink)}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.green{background:var(--green);border-color:var(--green);color:#fff}.btn.soft{background:#edf4ff;color:#2862d9;border-color:#d5e4ff}
    .content{max-width:1400px;margin:auto;padding:30px 34px 60px}.hero{background:linear-gradient(120deg,#173b5d,#3978f6);color:#fff;border-radius:26px;padding:28px 30px;display:flex;justify-content:space-between;gap:20px;align-items:center;box-shadow:0 16px 40px #173b5d20}.hero h1{margin:0 0 8px;font-size:27px}.hero p{margin:0;color:#dbeaff}.date-pill{background:#ffffff18;border:1px solid #ffffff2b;border-radius:16px;padding:13px 18px;font-weight:700}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:22px 0}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 7px 22px #16324f0b}.stat{padding:20px}.stat-top{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;font-weight:700}.stat i{font-size:22px}.stat strong{display:block;font-size:28px;margin-top:8px}.grid{display:grid;grid-template-columns:1.35fr .8fr;gap:18px}.panel{padding:22px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.panel h3{margin:0;font-size:18px}.muted{color:var(--muted);font-size:13px}.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.quick button{border:1px solid var(--line);background:#fff;border-radius:16px;padding:18px;text-align:left}.quick i{display:block;font-size:25px;color:var(--blue);margin-bottom:10px}.quick b{display:block}.quick small{color:var(--muted)}
    .list{display:grid;gap:10px}.row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:15px}.row-main{display:flex;gap:12px;align-items:center}.avatar{width:42px;height:42px;border-radius:14px;background:#edf4ff;color:var(--blue);display:grid;place-items:center;font-weight:800}.tag{display:inline-block;padding:5px 9px;border-radius:9px;background:#eef7f3;color:#17825d;font-size:11px;font-weight:700}.money{font-weight:800;color:var(--green)}
    .view{display:none}.view.active{display:block}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:14px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.table th{color:var(--muted);font-size:11px;text-transform:uppercase}.empty{text-align:center;color:var(--muted);padding:45px}
    .modal{position:fixed;inset:0;background:#102a43aa;z-index:20;display:grid;place-items:center;padding:18px}.dialog{background:#fff;width:min(620px,100%);max-height:92vh;overflow:auto;border-radius:24px;padding:25px;box-shadow:0 30px 80px #0003}.dialog h3{margin-top:0}.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700;color:var(--muted)}.field input,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;outline:none}.field input:focus,.field select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #3978f618}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
    .toast{position:fixed;right:22px;bottom:22px;background:#163b5d;color:#fff;padding:14px 18px;border-radius:13px;z-index:50;box-shadow:0 15px 35px #0003;font-weight:700}.parent{min-height:100vh;background:linear-gradient(135deg,#102a43,#24567e);display:grid;place-items:center;padding:20px}.login-card{background:#fff;width:min(480px,100%);border-radius:28px;padding:34px;text-align:center}.login-card .brand-mark{margin:0 auto 18px;background:#edf4ff}.login-card input{width:100%;font-size:24px;letter-spacing:8px;text-align:center;padding:16px;border:1px solid var(--line);border-radius:14px;margin:18px 0}.profile{background:var(--paper);min-height:100vh}.profile-head{background:var(--nav);color:#fff;padding:18px 6vw;display:flex;justify-content:space-between;align-items:center}.profile-body{max-width:960px;margin:auto;padding:24px;display:grid;gap:16px}.profile-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.profile .panel strong{font-size:24px}
    @media(max-width:900px){.shell{grid-template-columns:1fr}.sidebar{position:fixed;left:0;right:0;bottom:0;top:auto;height:72px;z-index:10;padding:8px}.brand,.side-foot{display:none}.nav{grid-template-columns:repeat(5,1fr);gap:3px}.nav button{padding:8px 3px;display:grid;place-items:center;gap:2px;font-size:9px;text-align:center}.nav i{font-size:20px}.topbar{height:68px;padding:0 16px}.content{padding:18px 14px 95px}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.hero{align-items:flex-start}.date-pill{display:none}.form{grid-template-columns:1fr}.field.full{grid-column:auto}.profile-grid{grid-template-columns:1fr}.top-actions .label{display:none}}
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="modal-root"></div>
  <script>
    const STORAGE="tt_mvp_v1";
    const PUBLIC_API_URL="https://script.google.com/macros/s/AKfycbybUrOlatKVbsMQNUUpcGiYPYUsiqFBMKGWKi96hEsSHVVa3YhFgdHfNmaXi9GUblgM_g/exec";
    const initial={settings:{name:"TRUNG TÂM HỌC TẬP",apiUrl:"",adminKey:""},students:[],classes:[],enrollments:[],attendance:[],fees:[],grades:[],comments:[]};
    let state=JSON.parse(localStorage.getItem(STORAGE)||"null")||structuredClone(initial);
    state.grades=Array.isArray(state.grades)?state.grades:[];
    state.comments=Array.isArray(state.comments)?state.comments:[];
    let currentView="dashboard";
    let selectedAttendanceClassId="";
    let selectedClassDetailId="";
    let selectedFeeMonth=new Date().toISOString().slice(0,10);
    const $=s=>document.querySelector(s);
    const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const uid=p=>p+"-"+Date.now()+"-"+Math.random().toString(16).slice(2);
    const money=v=>Number(v||0).toLocaleString("vi-VN")+" đ";
    const today=()=>new Date().toISOString().slice(0,10);
    function save(){localStorage.setItem(STORAGE,JSON.stringify(state))}
    function persist(type,record){save();if(!(state.settings.apiUrl||PUBLIC_API_URL))return Promise.resolve();return jsonp("save",{payload:JSON.stringify({type,record})}).then(r=>{if(!r.ok)throw Error(r.message||"Không thể lưu lên Google Sheet")}).catch(e=>toast("Đã lưu trên máy, nhưng Sheet chưa cập nhật: "+e.message))}
    function toast(msg){const e=document.createElement("div");e.className="toast";e.textContent=msg;document.body.append(e);setTimeout(()=>e.remove(),2600)}
    function isParent(){return new URLSearchParams(location.search).get("phhs")==="1"}
    function nav(view){currentView=view;render()}
    function render(){
      if(isParent()) return renderParentLogin();
      const names={dashboard:"Tổng quan",students:"Học sinh",classes:"Lớp học",attendance:"Điểm danh",fees:"Học phí"};
      $("#app").innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand"><div class="brand-mark"><i class="ph-fill ph-graduation-cap"></i></div><div><b>${esc(state.settings.name)}</b><small>Quản lý trung tâm</small></div></div><nav class="nav">
      ${[["dashboard","squares-four","Tổng quan"],["students","student","Học sinh"],["classes","chalkboard-teacher","Lớp học"],["attendance","calendar-check","Điểm danh"],["fees","wallet","Học phí"]].map(x=>`<button class="${currentView===x[0]?"active":""}" onclick="nav('${x[0]}')"><i class="ph-bold ph-${x[1]}"></i><span>${x[2]}</span></button>`).join("")}
      </nav><div class="side-foot"><button onclick="openSettings()"><i class="ph-bold ph-gear"></i> Cài đặt kết nối</button></div></aside><main><header class="topbar"><h2>${names[currentView]}</h2><div class="top-actions"><button class="btn" onclick="openGoogleSheet()"><i class="ph-bold ph-table"></i> <span class="label">Mở Google Sheet</span></button><button class="btn soft" onclick="syncData()"><i class="ph-bold ph-arrows-clockwise"></i> <span class="label">Tải dữ liệu</span></button></div></header><div class="content">${renderView()}</div></main></div>`;
    }
    function renderView(){return ({dashboard:dashboardView,students:studentView,classes:classView,attendance:attendanceView,fees:feeView}[currentView]||dashboardView)()}
    function dashboardView(){
      const paid=state.fees.filter(x=>x.status==="paid").reduce((s,x)=>s+Number(x.amount||0),0), due=state.fees.filter(x=>x.status!=="paid").length;
      return `<section class="hero"><div><h1>Chào mừng trở lại 👋</h1><p>Theo dõi hoạt động trung tâm trong một màn hình gọn gàng.</p></div><div class="date-pill"><i class="ph-bold ph-calendar"></i> ${new Date().toLocaleDateString("vi-VN")}</div></section>
      <section class="stats"><div class="stat"><div class="stat-top"><span>Học sinh</span><i class="ph-bold ph-student"></i></div><strong>${state.students.length}</strong></div><div class="stat"><div class="stat-top"><span>Lớp đang mở</span><i class="ph-bold ph-chalkboard"></i></div><strong>${state.classes.length}</strong></div><div class="stat"><div class="stat-top"><span>Đã thu</span><i class="ph-bold ph-coins"></i></div><strong style="font-size:21px">${money(paid)}</strong></div><div class="stat"><div class="stat-top"><span>Khoản chưa thu</span><i class="ph-bold ph-warning-circle"></i></div><strong>${due}</strong></div></section>
      <section class="grid"><div class="panel"><div class="panel-head"><div><h3>Học sinh mới</h3><span class="muted">Danh sách cập nhật gần đây</span></div><button class="btn" onclick="nav('students')">Xem tất cả</button></div><div class="list">${state.students.slice(-5).reverse().map(studentRow).join("")||'<div class="empty">Chưa có học sinh. Hãy thêm học sinh đầu tiên.</div>'}</div></div>
      <div class="panel"><div class="panel-head"><h3>Thao tác nhanh</h3></div><div class="quick"><button onclick="openStudent()"><i class="ph-bold ph-user-plus"></i><b>Thêm học sinh</b><small>Tạo hồ sơ và mã PIN</small></button><button onclick="openClass()"><i class="ph-bold ph-chalkboard-teacher"></i><b>Tạo lớp học</b><small>Lịch và học phí lớp</small></button><button onclick="nav('attendance')"><i class="ph-bold ph-calendar-check"></i><b>Điểm danh</b><small>Theo từng lớp, từng buổi</small></button><button onclick="nav('fees')"><i class="ph-bold ph-receipt"></i><b>Thu học phí</b><small>Theo dõi công nợ</small></button></div></div></section>`;
    }
    function studentRow(s){const cls=state.enrollments.filter(e=>e.studentId===s.id).map(e=>state.classes.find(c=>c.id===e.classId)?.name).filter(Boolean);return `<div class="row"><div class="row-main"><div class="avatar">${esc(s.name).split(" ").pop()?.[0]||"H"}</div><div><b>${esc(s.name)}</b><div class="muted">${esc(s.code)} · ${esc(s.phone||"Chưa có SĐT")}</div></div></div><span class="tag">${esc(cls.join(", ")||"Chưa xếp lớp")}</span></div>`}
    function studentView(){return `<div class="panel"><div class="panel-head"><div><h3>Danh sách học sinh</h3><span class="muted">${state.students.length} hồ sơ</span></div><button class="btn primary" onclick="openStudent()"><i class="ph-bold ph-user-plus"></i> Thêm học sinh</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Mã HS</th><th>Họ tên</th><th>Trường</th><th>PHHS</th><th>Mã tra cứu</th><th>Lớp học thêm</th></tr></thead><tbody>${state.students.map(s=>`<tr><td><b>${esc(s.code)}</b></td><td>${esc(s.name)}</td><td>${esc(s.schoolClass||"--")}</td><td>${esc(s.phone||"--")}</td><td><span class="tag">${esc(s.pin)}</span></td><td>${esc(state.enrollments.filter(e=>e.studentId===s.id).map(e=>state.classes.find(c=>c.id===e.classId)?.name).filter(Boolean).join(", ")||"--")}</td></tr>`).join("")||'<tr><td colspan="6" class="empty">Chưa có học sinh</td></tr>'}</tbody></table></div></div>`}
    function classView(){if(selectedClassDetailId){const cls=state.classes.find(c=>c.id===selectedClassDetailId);if(cls)return classDetailView(cls);selectedClassDetailId=""}return `<div class="toolbar"><button class="btn primary" onclick="openClass()"><i class="ph-bold ph-plus"></i> Tạo lớp</button></div><div class="stats">${state.classes.map(c=>`<button class="stat" style="text-align:left" onclick="selectedClassDetailId='${c.id}';render()"><div class="stat-top"><span>${esc(c.subject)}</span><i class="ph-bold ph-caret-right"></i></div><strong style="font-size:20px">${esc(c.name)}</strong><div class="muted">${esc(c.schedule||"Chưa đặt lịch")} · ${state.enrollments.filter(e=>e.classId===c.id).length} HS</div><div class="money" style="margin-top:8px">${money(c.tuition)} / buổi</div></button>`).join("")||'<div class="panel empty" style="grid-column:1/-1">Chưa có lớp học</div>'}</div>`}
    function attendanceView(){if(!selectedAttendanceClassId||!state.classes.some(c=>c.id===selectedAttendanceClassId))selectedAttendanceClassId=state.classes[0]?.id||"";const cls=state.classes.find(c=>c.id===selectedAttendanceClassId),date=window.selectedAttendanceDate||today(),members=cls?state.enrollments.filter(e=>e.classId===cls.id).map(e=>state.students.find(s=>s.id===e.studentId)).filter(Boolean):[];return `<div class="panel"><div class="panel-head"><div><h3>Điểm danh theo buổi</h3><span class="muted">Chọn lớp và ngày học, sau đó điều chỉnh các trường hợp đặc biệt</span></div><div class="toolbar" style="margin:0"><button class="btn green" onclick="markAllPresent()"><i class="ph-bold ph-checks"></i> Cả lớp có mặt</button><button class="btn primary" onclick="saveAttendance()">Lưu điểm danh</button></div></div><div class="toolbar"><select class="btn" id="att-class" onchange="selectedAttendanceClassId=this.value;render()">${state.classes.map(c=>`<option value="${c.id}" ${c.id===selectedAttendanceClassId?"selected":""}>${esc(c.name)}</option>`).join("")}</select><input class="btn" id="att-date" type="date" value="${date}" onchange="window.selectedAttendanceDate=this.value;render()"></div><div class="list">${members.map(s=>{const status=state.attendance.find(a=>a.classId===cls.id&&a.date===date&&a.studentId===s.id)?.status||"present";return `<div class="row attendance-student" data-id="${s.id}" data-status="${status}"><div class="row-main"><div class="avatar">${esc(s.name).slice(0,1)}</div><div><b>${esc(s.name)}</b><div class="muted">${esc(s.code)}</div></div></div><div class="toolbar" style="margin:0">${[["present","Có mặt","green"],["late","Đi muộn",""],["excused","Vắng có phép","soft"],["unexcused","Vắng không phép",""]].map(x=>`<button class="btn ${status===x[0]?(x[2]||"primary"):""}" onclick="setAttendanceStatus(this,'${x[0]}')">${x[1]}</button>`).join("")}</div></div>`}).join("")||'<div class="empty">Hãy tạo lớp và xếp học sinh vào lớp trước.</div>'}</div></div>`}
    function feeView(){const month=(selectedFeeMonth||today()).slice(0,7);return `<div class="panel"><div class="panel-head"><div><h3>Học phí theo lớp</h3><span class="muted">Theo dõi dự kiến, đã thu và còn thiếu trong từng tháng</span></div><input class="btn" type="month" value="${month}" onchange="selectedFeeMonth=this.value+'-01';render()"></div><div class="stats">${state.classes.map(c=>{const members=state.enrollments.filter(e=>e.classId===c.id),fees=state.fees.filter(f=>f.classId===c.id&&f.month===month),expected=fees.reduce((n,f)=>n+Number(f.amount||0),0),paid=fees.filter(f=>f.status==="paid").reduce((n,f)=>n+Number(f.amount||0),0),unpaid=fees.filter(f=>f.status!=="paid").length;return `<div class="stat"><div class="stat-top"><span>${esc(c.name)}</span><i class="ph-bold ph-wallet"></i></div><strong style="font-size:20px">${money(paid)} / ${money(expected)}</strong><div class="muted">${fees.length}/${members.length} học sinh đã lập phí · ${unpaid} chưa đóng</div><button class="btn soft" style="margin-top:12px;width:100%" onclick="generateClassFees('${c.id}','${month}')">Tính học phí lớp</button></div>`}).join("")||'<div class="empty" style="grid-column:1/-1">Chưa có lớp học</div>'}</div><div class="table-wrap"><table class="table"><thead><tr><th>Lớp</th><th>Học sinh</th><th>Số buổi</th><th>Đơn giá</th><th>Phải thu</th><th>Trạng thái</th><th></th></tr></thead><tbody>${state.fees.filter(f=>f.month===month).map(f=>{const s=state.students.find(x=>x.id===f.studentId),c=state.classes.find(x=>x.id===f.classId);return `<tr><td>${esc(c?.name||"--")}</td><td>${esc(s?.name||"Không rõ")}</td><td>${Number(f.sessions||0)}</td><td>${money(f.unitPrice||0)}</td><td class="money">${money(f.amount)}</td><td><span class="tag">${f.status==="paid"?"Đã đóng":"Chưa đóng"}</span></td><td><button class="btn" onclick="toggleFee('${f.id}')">${f.status==="paid"?"Đánh dấu chưa đóng":"Xác nhận đã đóng"}</button></td></tr>`}).join("")||'<tr><td colspan="7" class="empty">Chưa lập học phí cho tháng này</td></tr>'}</tbody></table></div></div>`}
    function setAttendanceStatus(button,status){const card=button.closest(".attendance-student");card.dataset.status=status;card.querySelectorAll("button").forEach(b=>b.classList.remove("primary","green","soft"));button.classList.add(status==="present"?"green":status==="excused"?"soft":"primary")}
    function markAllPresent(){document.querySelectorAll(".attendance-student").forEach(card=>{card.dataset.status="present";card.querySelectorAll("button").forEach((b,i)=>{b.classList.remove("primary","green","soft");if(i===0)b.classList.add("green")})});toast("Đã chọn cả lớp có mặt")}
    function countClassSessions(classId,month){return new Set(state.attendance.filter(a=>a.classId===classId&&String(a.date||"").slice(0,7)===month).map(a=>a.date)).size}
    function generateClassFees(classId,month){const cls=state.classes.find(c=>c.id===classId),sessions=countClassSessions(classId,month),members=state.enrollments.filter(e=>e.classId===classId);if(!sessions)return toast("Lớp chưa có buổi điểm danh trong tháng này");let created=0;members.forEach(e=>{if(state.fees.some(f=>f.studentId===e.studentId&&f.classId===classId&&f.month===month))return;const record={id:uid("hp"),studentId:e.studentId,classId,month,sessions,unitPrice:Number(cls.tuition||0),amount:sessions*Number(cls.tuition||0),status:"unpaid"};state.fees.push(record);persist("fee",record);created++});render();toast(created?"Đã lập học phí cho "+created+" học sinh":"Học phí lớp đã được lập trước đó")}
    function classDetailView(cls){const studentIds=state.enrollments.filter(e=>e.classId===cls.id).map(e=>e.studentId),students=state.students.filter(s=>studentIds.includes(s.id)),month=today().slice(0,7),sessions=countClassSessions(cls.id,month),grades=state.grades.filter(g=>g.classId===cls.id),avg=grades.length?(grades.reduce((n,g)=>n+Number(g.score||0),0)/grades.length).toFixed(1):"--";return `<div class="toolbar"><button class="btn" onclick="selectedClassDetailId='';render()"><i class="ph-bold ph-arrow-left"></i> Danh sách lớp</button><button class="btn soft" onclick="openClassScoreSheet('${cls.id}')"><i class="ph-bold ph-table"></i> Mở bảng điểm lớp</button><button class="btn soft" onclick="syncData()"><i class="ph-bold ph-arrows-clockwise"></i> Tải kết quả</button></div><div class="hero"><div><h1>${esc(cls.name)}</h1><p>${esc(cls.subject)} · ${esc(cls.schedule||"Chưa đặt lịch")} · ${money(cls.tuition)}/buổi</p></div><div class="date-pill">${students.length} học sinh</div></div><div class="stats"><div class="stat"><div class="stat-top"><span>Sĩ số</span></div><strong>${students.length}</strong></div><div class="stat"><div class="stat-top"><span>Buổi học tháng này</span></div><strong>${sessions}</strong></div><div class="stat"><div class="stat-top"><span>Điểm trung bình</span></div><strong>${avg}</strong></div><div class="stat"><div class="stat-top"><span>Học phí/buổi</span></div><strong style="font-size:19px">${money(cls.tuition)}</strong></div></div><div class="panel table-wrap"><div class="panel-head"><div><h3>Hồ sơ học tập của lớp</h3><span class="muted">Trong sheet DIEM của lớp: nhập tên bài ở hàng 4, ngày ở hàng 5 và dán cả cột điểm từ hàng 6</span></div></div><table class="table"><thead><tr><th>Học sinh</th><th>Trường</th><th>Điểm TB</th><th>Chuyên cần</th><th>Nhận xét mới nhất</th><th>Học phí tháng</th></tr></thead><tbody>${students.map(s=>{const sg=grades.filter(g=>g.studentId===s.id),sa=state.attendance.filter(a=>a.classId===cls.id&&a.studentId===s.id),good=sa.filter(a=>a.status==="present"||a.status==="late").length,comment=state.comments.filter(c=>c.classId===cls.id&&c.studentId===s.id).sort((x,y)=>String(y.date).localeCompare(String(x.date)))[0],fee=state.fees.find(f=>f.classId===cls.id&&f.studentId===s.id&&f.month===month);return `<tr><td><b>${esc(s.name)}</b><div class="muted">${esc(s.code)}</div></td><td>${esc(s.schoolClass||"--")}</td><td>${sg.length?(sg.reduce((n,g)=>n+Number(g.score||0),0)/sg.length).toFixed(1):"--"}</td><td>${sa.length?Math.round(good/sa.length*100)+"%":"--"}</td><td>${esc(comment?.text||"Chưa có nhận xét")}</td><td><span class="tag">${fee?(fee.status==="paid"?"Đã đóng":"Chưa đóng"):"Chưa lập"}</span></td></tr>`}).join("")||'<tr><td colspan="6" class="empty">Lớp chưa có học sinh</td></tr>'}</tbody></table></div>`}
    function openClassScoreSheet(classId){const cls=state.classes.find(c=>c.id===classId);if(!cls?.scoreSheetUrl)return toast("Hãy bấm Tải dữ liệu để chuẩn bị bảng điểm trước");window.open(cls.scoreSheetUrl,"_blank","noopener")}
    function quickAdd(){({students:openStudent,classes:openClass,fees:openFee,attendance:saveAttendance}[currentView]||openStudent)()}
    function modal(html){$("#modal-root").innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="dialog">${html}</div></div>`}
    function closeModal(){$("#modal-root").innerHTML=""}
    function openStudent(){modal(`<h3>Thêm học sinh</h3><form class="form" onsubmit="addStudent(event)"><div class="field"><label>Mã học sinh</label><input name="code" required></div><div class="field"><label>Họ và tên</label><input name="name" required></div><div class="field"><label>Trường đang học</label><input name="schoolClass"></div><div class="field"><label>Số điện thoại PHHS</label><input name="phone" inputmode="tel"></div><div class="field full"><label>Xếp vào lớp học thêm</label><select name="classId"><option value="">Chưa xếp lớp</option>${state.classes.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select></div><div class="dialog-actions field full"><button type="button" class="btn" onclick="closeModal()">Hủy</button><button class="btn primary">Lưu học sinh</button></div></form>`)}
    function addStudent(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(state.students.some(s=>s.code===d.code))return toast("Mã học sinh đã tồn tại");const used=new Set(state.students.map(s=>s.pin));let pin;do{pin=String(Math.floor(Math.random()*100000)).padStart(5,"0")}while(used.has(pin));const s={id:uid("hs"),code:d.code.trim(),name:d.name.trim(),schoolClass:d.schoolClass.trim(),phone:d.phone.replace(/\D/g,""),pin};state.students.push(s);persist("student",s);if(d.classId){const enrollment={id:uid("dk"),studentId:s.id,classId:d.classId};state.enrollments.push(enrollment);persist("enrollment",enrollment)}closeModal();render();toast("Đã thêm học sinh và tạo mã "+pin)}
    function openClass(){modal(`<h3>Tạo lớp học thêm</h3><form class="form" onsubmit="addClass(event)"><div class="field"><label>Tên lớp</label><input name="name" placeholder="Toán 9A" required></div><div class="field"><label>Môn học</label><input name="subject" placeholder="Toán" required></div><div class="field"><label>Lịch học</label><input name="schedule" placeholder="Thứ 3, 18:00"></div><div class="field"><label>Học phí/buổi</label><input name="tuition" type="number" min="0" step="1000" placeholder="Ví dụ: 100000" required></div><div class="dialog-actions field full"><button type="button" class="btn" onclick="closeModal()">Hủy</button><button class="btn primary">Tạo lớp</button></div></form>`)}function addClass(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target)),record={id:uid("lop"),...d};state.classes.push(record);persist("class",record);closeModal();render();toast("Đã tạo lớp học")}
    function saveAttendance(){const cls=selectedAttendanceClassId,date=window.selectedAttendanceDate||today();if(!cls||!date)return toast("Chưa có lớp học để điểm danh");document.querySelectorAll(".attendance-student").forEach(card=>{state.attendance=state.attendance.filter(a=>!(a.classId===cls&&a.date===date&&a.studentId===card.dataset.id));const record={id:"dd-"+cls+"-"+date+"-"+card.dataset.id,classId:cls,date,studentId:card.dataset.id,status:card.dataset.status};state.attendance.push(record);persist("attendance",record)});toast("Đã lưu điểm danh cho cả lớp")}
    function countClassSessions(classId,month){return new Set(state.attendance.filter(a=>a.classId===classId&&String(a.date||"").slice(0,7)===month).map(a=>a.date)).size}
    function refreshFeeForm(){const classId=$("#fee-class")?.value,select=$("#fee-student");if(!select)return;const ids=state.enrollments.filter(e=>e.classId===classId).map(e=>e.studentId);select.innerHTML=state.students.filter(s=>ids.includes(s.id)).map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("");updateFeeEstimate()}
    function updateFeeEstimate(){const classId=$("#fee-class")?.value,month=$("#fee-month")?.value,cls=state.classes.find(c=>c.id===classId),sessions=countClassSessions(classId,month),unit=Number(cls?.tuition||0),amount=sessions*unit;if($("#fee-sessions"))$("#fee-sessions").value=sessions+" buổi";if($("#fee-unit"))$("#fee-unit").value=money(unit);if($("#fee-amount"))$("#fee-amount").value=amount;if($("#fee-formula"))$("#fee-formula").textContent=sessions+" buổi × "+money(unit)+" = "+money(amount)}
    function openFee(){nav("fees")}
    function addFee(e){e?.preventDefault?.()}
    function toggleFee(id){const f=state.fees.find(x=>x.id===id);f.status=f.status==="paid"?"unpaid":"paid";f.paidAt=f.status==="paid"?today():"";persist("fee",f);render()}
    function openSettings(){modal(`<h3>Kết nối Google Sheet</h3><p class="muted">Sau khi triển khai Code.gs, dán URL Web app và mã quản trị tại đây.</p><form class="form" onsubmit="saveSettings(event)"><div class="field full"><label>Tên trung tâm</label><input name="name" value="${esc(state.settings.name)}"></div><div class="field full"><label>URL Apps Script</label><input name="apiUrl" value="${esc(state.settings.apiUrl)}"></div><div class="field full"><label>Mã quản trị</label><input name="adminKey" type="password" value="${esc(state.settings.adminKey)}"></div><div class="dialog-actions field full"><button type="button" class="btn" onclick="closeModal()">Hủy</button><button class="btn primary">Lưu cài đặt</button></div></form>`)}
    function saveSettings(e){e.preventDefault();state.settings={...state.settings,...Object.fromEntries(new FormData(e.target))};save();closeModal();render();toast("Đã lưu cài đặt")}
    function openGoogleSheet(){if(!state.settings.adminKey){openSettings();setTimeout(()=>toast("Tab ẩn danh chưa có mã quản trị. Hãy nhập mã rồi bấm Lưu cài đặt."),100);return}const tab=window.open("about:blank","_blank");if(!tab)return toast("Trình duyệt đang chặn cửa sổ mới");if(state.spreadsheetUrl){tab.location.href=state.spreadsheetUrl;return}jsonp("all",{}).then(r=>{if(!r.ok)throw Error(r.message);state={...state,...r.data,settings:state.settings};save();if(!state.spreadsheetUrl)throw Error("Chưa lấy được đường dẫn Google Sheet");tab.location.href=state.spreadsheetUrl;render()}).catch(e=>{tab.close();if(String(e.message).includes("Mã quản trị")){openSettings();setTimeout(()=>toast("Mã quản trị chưa đúng. Hãy nhập lại rồi bấm Lưu cài đặt."),100)}else toast(e.message)})}
    function syncData(){if(!state.settings.apiUrl)return openSettings();jsonp("all",{}).then(r=>{if(!r.ok)throw Error(r.message);state={...state,...r.data,settings:state.settings};save();render();toast("Đã tải dữ liệu từ Google Sheet")}).catch(e=>toast(e.message))}
    function jsonp(mode,params){return new Promise((resolve,reject)=>{const cb="ttcb"+Date.now();const s=document.createElement("script");const t=setTimeout(()=>done({ok:false,message:"Kết nối quá thời gian"}),20000);function done(r){clearTimeout(t);delete window[cb];s.remove();resolve(r)}window[cb]=done;s.onerror=()=>done({ok:false,message:"Không thể kết nối Google Sheet"});const apiUrl=state.settings.apiUrl||PUBLIC_API_URL;if(!apiUrl)return done({ok:false,message:"Chưa cấu hình URL Apps Script"});s.src=apiUrl+"?mode="+encodeURIComponent(mode)+"&adminKey="+encodeURIComponent(state.settings.adminKey)+"&callback="+cb+Object.entries(params).map(([k,v])=>"&"+k+"="+encodeURIComponent(v)).join("");document.head.append(s)})}
    function renderParentLogin(){$("#app").innerHTML=`<section class="parent"><form class="login-card" onsubmit="parentLookup(event)"><div class="brand-mark"><i class="ph-fill ph-graduation-cap"></i></div><h1>Cổng Phụ huynh</h1><p class="muted">Nhập mã tra cứu 5 chữ số để xem thông tin học tập</p><input name="pin" inputmode="numeric" maxlength="5" pattern="\\d{5}" placeholder="•••••" required><button class="btn primary" style="width:100%">TRA CỨU</button><p class="muted" style="margin-top:18px">${esc(state.settings.name)}</p></form></section>`}
    function parentLookup(e){e.preventDefault();const pin=new FormData(e.target).get("pin"),apiUrl=state.settings.apiUrl||PUBLIC_API_URL;if(apiUrl){jsonp("parent",{pin}).then(r=>{if(!r.ok)throw Error(r.message);state.students=[r.data.student];state.attendance=r.data.attendance||[];state.fees=r.data.fees||[];state.grades=r.data.grades||[];state.comments=r.data.comments||[];state.classes=r.data.classes||[];renderProfile(r.data.student)}).catch(x=>toast(x.message));return}const s=state.students.find(x=>x.pin===pin);if(!s)return toast("Mã tra cứu không chính xác");renderProfile(s)}
    function scoreChart(items){const sorted=items.slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))),w=760,h=210,left=42,right=18,top=18,bottom=52,plotW=w-left-right,plotH=h-top-bottom;if(!sorted.length)return '<div class="empty">Chưa có dữ liệu điểm</div>';const pts=sorted.map((g,index)=>{const x=left+(sorted.length===1?plotW/2:index*plotW/(sorted.length-1)),y=top+(10-Math.max(0,Math.min(10,Number(g.score||0))))/10*plotH;return{x,y,g}}),poly=pts.map(p=>p.x+','+p.y).join(' ');return `<div style="overflow-x:auto"><svg viewBox="0 0 ${w} ${h}" style="width:100%;min-width:620px;height:auto" role="img" aria-label="Biểu đồ điểm"><g stroke="#e3e9f1" stroke-width="1">${[0,2,4,6,8,10].map(v=>{const y=top+(10-v)/10*plotH;return `<line x1="${left}" y1="${y}" x2="${w-right}" y2="${y}"/><text x="8" y="${y+4}" fill="#708096" stroke="none" font-size="11">${v}</text>`}).join("")}</g><polyline points="${poly}" fill="none" stroke="#3978f6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>${pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="5" fill="#3978f6"/><text x="${p.x}" y="${p.y-10}" text-anchor="middle" fill="#172033" font-size="11" font-weight="700">${esc(p.g.score)}</text><text x="${p.x}" y="${h-25}" text-anchor="middle" fill="#708096" font-size="10">${esc((p.g.title||"Bài").slice(0,12))}</text>`).join("")}</svg></div>`}
    function renderProfile(s){const att=state.attendance.filter(a=>a.studentId===s.id),fees=state.fees.filter(f=>f.studentId===s.id),grades=state.grades.filter(g=>g.studentId===s.id),comments=state.comments.filter(c=>c.studentId===s.id),paid=fees.filter(f=>f.status==="paid").reduce((n,f)=>n+Number(f.amount),0),classes=state.classes.filter(c=>grades.some(g=>g.classId===c.id)||comments.some(x=>x.classId===c.id)||att.some(a=>a.classId===c.id));$("#app").innerHTML=`<section class="profile"><header class="profile-head"><div><b>HỒ SƠ HỌC TẬP</b><div style="font-size:12px;color:#b8d2e8">${esc(state.settings.name)}</div></div><button class="btn" onclick="renderParentLogin()">Đóng</button></header><main class="profile-body"><div class="panel"><h2>${esc(s.name)}</h2><p class="muted">Mã HS: ${esc(s.code)} · ${esc(s.schoolClass||"")}</p></div><div class="profile-grid"><div class="panel"><span class="muted">Số buổi học</span><strong>${att.length}</strong></div><div class="panel"><span class="muted">Có mặt / đi muộn</span><strong>${att.filter(a=>a.status==="present"||a.status==="late").length}</strong></div><div class="panel"><span class="muted">Điểm trung bình chung</span><strong>${grades.length?(grades.reduce((n,g)=>n+Number(g.score||0),0)/grades.length).toFixed(1):"--"}</strong></div><div class="panel"><span class="muted">Học phí đã đóng</span><strong style="font-size:19px">${money(paid)}</strong></div></div>${classes.map(c=>{const cg=grades.filter(g=>g.classId===c.id),cc=comments.filter(x=>x.classId===c.id).slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))),scores=cg.map(g=>Number(g.score||0)),avg=scores.length?(scores.reduce((n,v)=>n+v,0)/scores.length).toFixed(2):"--";return `<div class="panel"><div class="panel-head"><div><h3>${esc(c.name)} · ${esc(c.subject)}</h3><span class="muted">${cg.length} bài kiểm tra</span></div></div><div class="profile-grid"><div><span class="muted">Điểm TB</span><strong>${avg}</strong></div><div><span class="muted">Cao nhất</span><strong>${scores.length?Math.max(...scores):"--"}</strong></div><div><span class="muted">Thấp nhất</span><strong>${scores.length?Math.min(...scores):"--"}</strong></div></div>${scoreChart(cg)}<div class="list">${cc.slice(0,5).map(x=>`<div class="row"><div><b>Nhận xét</b><div class="muted">${esc(x.date||"")}</div></div><span>${esc(x.text)}</span></div>`).join("")}</div></div>`}).join("")||'<div class="panel empty">Chưa có kết quả học tập</div>'}<div class="panel"><h3>Tình hình học phí</h3><div class="list">${fees.map(f=>{const c=state.classes.find(x=>x.id===f.classId);return `<div class="row"><b>${esc(c?.name||"Lớp học")} · Tháng ${esc(f.month)}</b><span class="tag">${f.status==="paid"?"Đã đóng":"Chưa đóng"} · ${money(f.amount)}</span></div>`}).join("")||'<div class="empty">Chưa có dữ liệu học phí</div>'}</div></div></main></section>`}

    render();
  </script>
</body>
</html>
